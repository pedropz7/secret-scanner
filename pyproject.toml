[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-scanner"
version = "1.0.0"
description = "Scanner de segredos: varre um diretório procurando senhas, chaves de API e tokens expostos no código"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Lima Pais" }]
# Sem dependências de runtime, de propósito: menos superfície de ataque e
# nada de supply-chain a auditar numa ferramenta de segurança.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
secret-scanner = "secret_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
